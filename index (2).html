<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #ffd6e8, #ffeef5);
      font-family: "Comic Sans MS", "Arial Rounded MT Bold", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 50px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      animation: popIn 1s ease;
      position: relative;
      z-index: 2;
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }

    #subtext {
      font-size: 18px;
      margin-bottom: 30px;
      color: #555;
    }

    button {
      font-size: 18px;
      padding: 14px 30px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      margin-right: 15px;
    }

    #noBtn {
      background: #d3d3d3;
      position: absolute;
    }

    #message {
      margin-top: 25px;
      font-size: 22px;
      color: #ff4d6d;
      display: none;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  
  <audio id="bgMusic" loop>
    <source src="Documents/Versace.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div class="card">
    <h1>To my dear Hubby, Will you be my Valentine? 💘</h1>
    <div id="subtext">I promise snacks, laughs, good vibes and all the love you can imaagine 🥰</div>

    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 😅</button>

    <div id="message"></div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");
    const subtext = document.getElementById("subtext");

    const yesMessages = [
      "YAY!! 💕 I knew you’d say yes!",
      "Best Valentine ever 🥰💖",
      "You just made my whole day 😍",
      "Okay but this is officially cute now 💘"
    ];

    const noMessages = [
      "Wait… come back 😭",
      "Hey! That’s rude 😤",
      "You sure about that? 👀",
      "The answer is clearly yes 😌",
      "So you don't love me?",
      "I worked hard to make this😅"
    ];

    let noIndex = 0;

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      subtext.textContent = noMessages[noIndex % noMessages.length];
      noIndex++;
    });

    yesBtn.addEventListener("click", () => {
      const randomMsg = yesMessages[Math.floor(Math.random() * yesMessages.length)];
      message.textContent = randomMsg;
      message.style.display = "block";
      subtext.style.display = "none";
      yesBtn.style.display = "none";
      noBtn.style.display = "none";
    });

    // Floating hearts generator
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.textContent = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 3 + 4 + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createHeart, 400);
  </script>

</body>
</html>
